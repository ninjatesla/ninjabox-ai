<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.json">

  <title>NinjaBox Tarot LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .live {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* =========================
       SORU
       ========================= */

    .question-box {
      position: absolute;
      top: 19%;
      left: 4%;
      right: 4%;
      padding: 12px 15px;

      border-radius: 16px;

      background: rgba(0, 0, 0, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.18);

      color: white;
      text-align: center;

      z-index: 5;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .question {
      font-size: clamp(17px, 4.5vw, 24px);
      font-weight: bold;
      line-height: 1.2;
    }

    /* =========================
       TAROT KARTI - MERKEZ
       ========================= */

    .card {
      position: absolute;
      top: 59%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(31vw, 190px);
      max-height: 40vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9);
      z-index: 3;
    }

    .orientation {
      display: none !important;
    }

    /* =========================
       CANLI CHAT
       ========================= */

    .chat-panel {
      display: none !important;
      position: absolute;

      left: 4%;
      bottom: 30%;

      width: 65%;
      max-height: 24%;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      gap: 5px;

      z-index: 6;
    }

    .chat-line {
      align-self: flex-start;

      max-width: 100%;

      padding: 5px 9px;

      border-radius: 13px;

      background: rgba(0, 0, 0, 0.62);

      color: white;

      font-size: clamp(12px, 3.2vw, 16px);

      line-height: 1.2;

      text-shadow:
        0 1px 3px #000;
    }

    .chat-name {
      font-weight: bold;
      margin-right: 4px;
    }

    .chat-line.gift {
      background: rgba(110, 45, 165, 0.78);
      font-weight: bold;
    }

    /* Cevap yalnızca seslendirilir; ekranda gösterilmez. */
    .answer {
      display: none !important;
    }

    /* =========================
       ALT DURUM
       ========================= */

    .status {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      white-space: nowrap;
      z-index: 8;
    }

    .controls {
      position: fixed;
      bottom: 5%;
      left: 5%;
      right: 5%;
      display: flex;
      gap: 10px;
      z-index: 9999;
    }

    .control-button {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 700;
      padding: 10px 6px;
    }

    .control-button:active {
      background: rgba(45,45,45,0.95);
    }
  </style>
</head>

<body>
  <div class="controls">
    <button id="voiceTestButton" class="control-button" type="button">SES TESTİ</button>
    <div class="control-button" style="display:flex;align-items:center;justify-content:center;" aria-live="polite">TAROT LIVE HAZIR</div>
  </div>

  <div class="live">

    <video
      id="backgroundVideo"
      class="background-video"
      src="/tarot.mp4"
      autoplay
      muted
      loop
      playsinline>
    </video>

    <div class="overlay">

      <div id="status" class="status">
        NinjaBox · Sesli yorum aktif
      </div>

      <div
        id="orientation"
        class="orientation">
        TAROT
      </div>

      <img
        id="card"
        class="card"
        src=""
        alt="Tarot Kartı"
        style="display:none;">

      <div
        id="chatPanel"
        class="chat-panel">
      </div>

      <div
        class="answer"
        id="answer">
        
      </div>

      <div class="question-box">

        <div
          class="username"
          id="username">
        </div>

        <div
          class="question"
          id="question">
          
        </div>

      </div>

    </div>

  </div>

    <script>

    const usernameEl =
      document.getElementById("username");

    const questionEl =
      document.getElementById("question");

    const cardEl =
      document.getElementById("card");

    const orientationEl =
      document.getElementById("orientation");

    const answerEl =
      document.getElementById("answer");

    const chatPanelEl =
      document.getElementById("chatPanel");
      let activeQuestionId = null;
      let introTimer = null;


    const socketUrl =
      "wss://ninjabox-ai-production.up.railway.app";


    const socket =
      new WebSocket(socketUrl);


    /* =========================
       CHAT EKLE
       ========================= */

    function addChat(
      username,
      comment,
      extraClass = ""
    ) {

      if (!comment) {
        return;
      }

      const line =
        document.createElement("div");

      line.className =
        "chat-line " + extraClass;


      const name =
        document.createElement("span");

      name.className =
        "chat-name";

      name.textContent =
        "@" + (username || "izleyici");


      const text =
        document.createElement("span");

      text.textContent =
        comment;


      line.appendChild(name);
      line.appendChild(text);

      chatPanelEl.appendChild(line);


      while (
        chatPanelEl.children.length > 5
      ) {

        chatPanelEl.removeChild(
          chatPanelEl.firstChild
        );

      }

    }
    function speakAnswer(text) {
      if (!text || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "tr-TR";
      utterance.rate = 0.98;
      utterance.pitch = 1.05;
      utterance.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const turkishVoice = voices.find(v => (v.lang || "").toLowerCase().startsWith("tr"));
      if (turkishVoice) utterance.voice = turkishVoice;
      window.speechSynthesis.speak(utterance);
    }



    /* =========================
       WEBSOCKET BAĞLANTI
       ========================= */

    socket.onopen = () => {

      console.log(
        "WebSocket bağlantısı başarılı."
      );


      answerEl.textContent =
        "Tarot LIVE hazır. Sorunu sohbete yaz...";

    };


    /* =========================
       CANLI EVENTLER
       ========================= */

    socket.onmessage = (event) => {
  try {
    const data = JSON.parse(event.data);

    console.log("LIVE EVENT:", data);

    if (data.type === "chat") {
      return;
    }

    if (data.type === "gift_priority") {
      return;
    }

    if (data.type === "tarot_start") {
      activeQuestionId = data.questionId;

      if (introTimer) {
        clearTimeout(introTimer);
        introTimer = null;
      }

      usernameEl.textContent =
        data.username ? "@" + data.username : "";

      questionEl.textContent =
        data.question || "";

      orientationEl.textContent =
        data.orientation === "reversed"
          ? "TERS"
          : "DÜZ";

      answerEl.textContent =
        "Kartın mesajına bakıyorum...";

      if (data.image) {
        cardEl.src = "/" + data.image;
        cardEl.style.display = "block";
      }

      return;
    }

    if (data.type === "tarot_answer") {
      if (data.questionId !== activeQuestionId) {
        return;
      }

      if (introTimer) {
        clearTimeout(introTimer);
        introTimer = null;
      }

      answerEl.textContent =
         data.answer || "";

      speakAnswer(data.answer || "");
      return;
    }

  } catch (error) {
    console.error(
      "LIVE event error:",
      error
    );
  }
};

    /* =========================
       HATA
       ========================= */

    socket.onerror = (error) => {

      console.error(
        "WebSocket error:",
        error
      );


      answerEl.textContent =
        "LIVE bağlantısı kurulamadı.";

    };


    /* =========================
       BAĞLANTI KAPANIRSA
       ========================= */

    socket.onclose = () => {

      console.log(
        "WebSocket bağlantısı kapandı."
      );

    };


    /* =========================
       SERVICE WORKER
       ========================= */

    if (
      "serviceWorker"
      in navigator
    ) {

      navigator.serviceWorker.register(
        "/sw.js"
      );

    }
const voiceTestButton = document.getElementById("voiceTestButton");
if (voiceTestButton) {
  voiceTestButton.onclick = () => {
    speakAnswer("Merhaba. NinjaBox ses testi çalışıyor.");
  };
}

  </script>

</body>
  
</html>
