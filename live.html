<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>NinjaBox Tarot LIVE</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
    .live{position:relative;width:100%;height:100vh;overflow:hidden;background:#000}
    .background-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;inset:0;pointer-events:none}
    .question-box{position:absolute;top:19%;left:4%;right:4%;padding:12px 15px;border-radius:16px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.18);color:#fff;text-align:center;z-index:5}
    .username{font-size:17px;font-weight:bold;margin-bottom:5px}.question{font-size:clamp(17px,4.5vw,24px);font-weight:bold;line-height:1.2}
    .waiting-label{position:absolute;top:28.2%;left:50%;transform:translateX(-50%);width:90%;text-align:center;color:#fff;font-size:clamp(17px,4.5vw,23px);font-weight:700;text-shadow:0 2px 6px #000;z-index:4;display:none}
    .card{position:absolute;top:28.2%;left:50%;transform:translateX(-50%);width:min(31vw,190px);max-height:40vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 35px rgba(0,0,0,.9);z-index:3}
    .three-cards{position:absolute;top:28%;left:2%;right:2%;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;z-index:4}
    .three-card{min-width:0;text-align:center;color:#fff;text-shadow:0 2px 5px #000}
    .three-card img{width:100%;max-width:140px;height:min(29vh,220px);object-fit:contain;border-radius:8px;filter:drop-shadow(0 6px 10px #000)}
    .three-card .position{font-size:clamp(10px,2.5vw,13px);font-weight:bold;margin-bottom:4px}
    .three-card .card-name{font-size:clamp(11px,2.8vw,15px);font-weight:bold;line-height:1.15;margin-top:4px}
    .three-card .orientation{font-size:10px;opacity:.9;margin-top:2px}
    .relationship-cards{position:absolute;top:28%;left:1.5%;right:1.5%;display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;z-index:4}
    .relationship-card{min-width:0;text-align:center;color:#fff;text-shadow:0 2px 5px #000}
    .relationship-card img{width:100%;height:min(22vh,175px);object-fit:contain;border-radius:6px;filter:drop-shadow(0 5px 8px #000)}
    .relationship-card .position-label{font-size:clamp(8px,2vw,11px);font-weight:bold;line-height:1.1;min-height:23px;margin-bottom:3px}
    .relationship-card .card-name{font-size:clamp(9px,2.2vw,12px);font-weight:bold;line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
    .relationship-card .card-side{font-size:9px;opacity:.9;margin-top:2px}
    .orientation,.answer,.chat-panel{display:none!important}.status{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.72);font-size:10px;white-space:nowrap;z-index:8}
    .controls{position:fixed;bottom:5%;left:5%;right:5%;display:flex;gap:10px;z-index:9999}.control-button{flex:1;min-width:0;min-height:44px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(0,0,0,.82);color:#fff;font-size:clamp(12px,3.2vw,15px);font-weight:700;padding:10px 6px}
  </style>
</head>
<body>
  <div class="controls">
    <button id="voiceTestButton" class="control-button" type="button">SES TESTİ</button>
    <div class="control-button" style="display:flex;align-items:center;justify-content:center;" aria-live="polite">TAROT LIVE HAZIR</div>
  </div>
  <div class="live">
    <video id="backgroundVideo" class="background-video" src="/tarot.mp4" autoplay muted loop playsinline></video>
    <audio id="burcIntroAudio" src="/burc.mp3" preload="auto"></audio>
    <div class="overlay">
      <div id="status" class="status">NinjaBox · Sesli yorum aktif</div>
      <div id="orientation" class="orientation">TAROT</div>
      <img id="card" class="card" src="" alt="Tarot Kartı" style="display:none;">
      <div id="relationshipCards" class="relationship-cards">
        <div class="relationship-card"><div class="position-label">DUYGULAR</div><img id="relationshipCardImage0" src="" alt=""><div class="card-name" id="relationshipCardName0"></div><div class="card-side" id="relationshipCardSide0"></div></div>
        <div class="relationship-card"><div class="position-label">DÜŞÜNCELER</div><img id="relationshipCardImage1" src="" alt=""><div class="card-name" id="relationshipCardName1"></div><div class="card-side" id="relationshipCardSide1"></div></div>
        <div class="relationship-card"><div class="position-label">GİZLİ DİNAMİKLER</div><img id="relationshipCardImage2" src="" alt=""><div class="card-name" id="relationshipCardName2"></div><div class="card-side" id="relationshipCardSide2"></div></div>
        <div class="relationship-card"><div class="position-label">ENGEL</div><img id="relationshipCardImage3" src="" alt=""><div class="card-name" id="relationshipCardName3"></div><div class="card-side" id="relationshipCardSide3"></div></div>
        <div class="relationship-card"><div class="position-label">OLASI YÖN</div><img id="relationshipCardImage4" src="" alt=""><div class="card-name" id="relationshipCardName4"></div><div class="card-side" id="relationshipCardSide4"></div></div>
      </div>
      <div id="threeCards" class="three-cards">
        <div class="three-card"><div class="position">GEÇMİŞ</div><img id="threeCardImage0" src="" alt=""><div class="card-name" id="threeCardName0"></div><div class="orientation" id="threeCardOrientation0"></div></div>
        <div class="three-card"><div class="position">ŞİMDİ</div><img id="threeCardImage1" src="" alt=""><div class="card-name" id="threeCardName1"></div><div class="orientation" id="threeCardOrientation1"></div></div>
        <div class="three-card"><div class="position">OLASI YÖN</div><img id="threeCardImage2" src="" alt=""><div class="card-name" id="threeCardName2"></div><div class="orientation" id="threeCardOrientation2"></div></div>
      </div>
      <div id="chatPanel" class="chat-panel"></div>
      <div class="answer" id="answer"></div>
      <div class="question-box"><div class="username" id="username"></div><div class="question" id="question"></div></div>
      <div id="waitingLabel" class="waiting-label">Yeni soru bekleniyor...</div>
    </div>
  </div>
<script>
  const usernameEl=document.getElementById("username");
  const questionEl=document.getElementById("question");
  const cardEl=document.getElementById("card");
  const threeCardsEl=document.getElementById("threeCards");
  const relationshipCardsEl=document.getElementById("relationshipCards");
  const orientationEl=document.getElementById("orientation");
  const answerEl=document.getElementById("answer");
  const waitingLabelEl=document.getElementById("waitingLabel");
  const backgroundVideo=document.getElementById("backgroundVideo");
  const burcIntroAudio=document.getElementById("burcIntroAudio");
  let activeQuestionId=null, displayCleanupTimer=null, finishSafetyTimer=null;
  const socket=new WebSocket("wss://ninjabox-ai-production.up.railway.app");

  function setBackground(file){
    const wanted="/"+file;
    if(!backgroundVideo.getAttribute("src")?.endsWith(wanted)){
      backgroundVideo.src=wanted;
      backgroundVideo.load();
    }
    backgroundVideo.loop=true;
    const playPromise=backgroundVideo.play();
    if(playPromise && typeof playPromise.catch==="function") playPromise.catch(()=>{});
  }
  function hideThreeCards(){if(threeCardsEl)threeCardsEl.style.display="none";}
  function hideRelationshipCards(){if(relationshipCardsEl)relationshipCardsEl.style.display="none";}
  function showWaitingScreen(){
    usernameEl.textContent=""; questionEl.textContent=""; cardEl.style.display="none";
    hideThreeCards(); answerEl.textContent=""; waitingLabelEl.style.display="block";
  }
  function finishItemAfterDisplay(questionId, finishType){
    if(displayCleanupTimer) clearTimeout(displayCleanupTimer);
    displayCleanupTimer=setTimeout(()=>{
      if(Number(activeQuestionId)!==Number(questionId)) return;
      showWaitingScreen();
      if(finishType==="magic_finished" || finishType==="burc_finished" || finishType==="threecard_finished" || finishType==="iliski_finished") setBackground("tarot.mp4");
      if(finishType==="iliski_finished") hideRelationshipCards();
      if(socket.readyState===WebSocket.OPEN) socket.send(JSON.stringify({type:finishType,questionId}));
      displayCleanupTimer=null;
    },15000);
  }
  let lastTurkishVoiceName="";
  function speakAnswer(text,onFinished){
    if(!text || !("speechSynthesis" in window)){if(onFinished)onFinished();return;}
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang="tr-TR";
    const voices=window.speechSynthesis.getVoices();
    const turkishVoices=voices.filter(v=>(v.lang||"").toLowerCase().startsWith("tr"));
    let voicePool=turkishVoices.length>1?turkishVoices:voices.filter(v=>(v.lang||"").toLowerCase().startsWith("tr-tr"));
    if(voicePool.length>1){let choices=voicePool.filter(v=>v.name!==lastTurkishVoiceName);if(!choices.length)choices=voicePool;utterance.voice=choices[Math.floor(Math.random()*choices.length)];lastTurkishVoiceName=utterance.voice.name;}
    else if(voicePool.length===1)utterance.voice=voicePool[0];
    utterance.rate=[0.94,0.98,1.02,1.05][Math.floor(Math.random()*4)];
    utterance.pitch=[0.94,1.0,1.04,1.08][Math.floor(Math.random()*4)];
    utterance.volume=1;
    let ended=false;
    const complete=()=>{if(ended)return;ended=true;if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}if(onFinished)onFinished();};
    utterance.onend=complete; utterance.onerror=complete;
    window.speechSynthesis.speak(utterance);
    if(onFinished) finishSafetyTimer=setTimeout(complete,90000);
  }
  function playBurcIntro(username){
    const prompts=[
      `${username||"İzleyici"}, burcunu yaz; yükselenini biliyorsan onu da ekle, yorumunu hemen hazırlayalım.`,
      `Sıra sende ${username||""}. Güneş burcunu sohbete yaz, yükselenini biliyorsan yanına ekle.`,
      `${username||"Dostum"}, burç yorumuna geçiyoruz. Burcunu ve varsa yükselenini gönder.`,
      `Hangi burçsun ${username||""}? Burcunu yaz, yükselenini biliyorsan onu da belirt.`,
      `Şimdi gökyüzü yorumunu hazırlayalım ${username||""}. Burcunu yazman yeterli; yükselenini biliyorsan onu da ekleyebilirsin.`
    ];
    if(burcIntroAudio){burcIntroAudio.pause();burcIntroAudio.currentTime=0;}
    speakAnswer(prompts[Math.floor(Math.random()*prompts.length)]);
  }
  function playThreeCardIntro(){ setBackground("3kart.mp4"); }

  socket.onopen=()=>{answerEl.textContent="Tarot LIVE hazır. Sorunu sohbete yaz...";};
  socket.onmessage=(event)=>{
    try{
      const data=JSON.parse(event.data);
      console.log("LIVE EVENT:",data);
      if(data.type==="tarot_start"){
        activeQuestionId=data.questionId; setBackground("tarot.mp4"); hideThreeCards(); hideRelationshipCards();
        waitingLabelEl.style.display="none";
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent=data.question||"";
        orientationEl.textContent=data.orientation==="reversed"?"TERS":"DÜZ";
        answerEl.textContent="Kartın mesajına bakıyorum...";
        if(data.image){cardEl.src="/"+data.image;cardEl.style.display="block";}
        return;
      }
      if(data.type==="tarot_answer"){
        if(Number(data.questionId)!==Number(activeQuestionId))return;
        answerEl.textContent=data.answer||"";
        speakAnswer(data.answer||"",()=>finishItemAfterDisplay(data.questionId,"tarot_finished"));
        return;
      }
      if(data.type==="burc_start"){
        activeQuestionId=data.questionId; setBackground("tarot.mp4"); hideThreeCards(); hideRelationshipCards();
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        if(burcIntroAudio){burcIntroAudio.pause();burcIntroAudio.currentTime=0;}
        waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent="Burcunu ve varsa yükselen burcunu sohbete yaz";
        cardEl.style.display="none"; answerEl.textContent="Burç bilgisi bekleniyor...";
        playBurcIntro(data.username);
        return;
      }
      if(data.type==="burc_answer"){
        if(Number(data.questionId)!==Number(activeQuestionId))return;
        if(burcIntroAudio){burcIntroAudio.pause();burcIntroAudio.currentTime=0;}
        questionEl.textContent=data.sunSign ? `${data.sunSign}${data.risingSign?" · Yükselen "+data.risingSign:""}` : "Burç bilgisi alınamadı";
        answerEl.textContent=data.answer||"";
        speakAnswer(data.answer||"",()=>finishItemAfterDisplay(data.questionId,"burc_finished"));
        return;
      }
      if(data.type==="magic_start"){
        activeQuestionId=data.questionId;
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent=""; cardEl.style.display="none"; hideThreeCards(); hideRelationshipCards(); answerEl.textContent="";
        setBackground("sihirli.mp4");
        return;
      }
      if(data.type==="magic_answer"){
        if(Number(data.questionId)!==Number(activeQuestionId))return;
        speakAnswer(data.answer||"",()=>{setBackground("tarot.mp4");finishItemAfterDisplay(data.questionId,"magic_finished");});
        return;
      }
      if(data.type==="iliski_start"){
        activeQuestionId=data.questionId;
        hideThreeCards(); hideRelationshipCards();
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent="İLİŞKİ AÇILIMI HAZIRLANIYOR";
        cardEl.style.display="none"; answerEl.textContent="";
        setBackground("iliski.mp4");
        return;
      }
      if(data.type==="iliski_answer"){
        if(Number(data.questionId)!==Number(activeQuestionId))return;
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        cardEl.style.display="none"; hideThreeCards(); waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent="NINJABOX İLİŞKİ AÇILIMI";
        const cards=Array.isArray(data.cards)?data.cards:[];
        cards.slice(0,5).forEach((card,index)=>{
          const image=document.getElementById("relationshipCardImage"+index);
          const name=document.getElementById("relationshipCardName"+index);
          const side=document.getElementById("relationshipCardSide"+index);
          image.src="/"+(card.image||"");
          image.alt=card.name||"İlişki tarot kartı";
          name.textContent=card.name||"";
          side.textContent=card.orientation==="reversed"?"TERS":"DÜZ";
        });
        relationshipCardsEl.style.display="grid";
        answerEl.textContent=data.answer||"";
        speakAnswer(data.answer||"",()=>finishItemAfterDisplay(data.questionId,"iliski_finished"));
        return;
      }

      if(data.type==="threecard_start"){
        activeQuestionId=data.questionId;
        setBackground("tarot.mp4");
        hideThreeCards(); hideRelationshipCards();
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent="ÜÇ KART AÇILIMI HAZIRLANIYOR";
        cardEl.style.display="none";
        answerEl.textContent="";
        playThreeCardIntro();
        return;
      }
      if(data.type==="threecard_answer"){
        if(Number(data.questionId)!==Number(activeQuestionId))return;
        setBackground("tarot.mp4");
        if(displayCleanupTimer){clearTimeout(displayCleanupTimer);displayCleanupTimer=null;}
        if(finishSafetyTimer){clearTimeout(finishSafetyTimer);finishSafetyTimer=null;}
        cardEl.style.display="none"; waitingLabelEl.style.display="none";
        usernameEl.textContent=data.username?"@"+data.username:"";
        questionEl.textContent="ÜÇ KART AÇILIMI";
        const cards=Array.isArray(data.cards)?data.cards:[];
        cards.slice(0,3).forEach((card,index)=>{
          document.getElementById("threeCardImage"+index).src="/"+(card.image||"");
          document.getElementById("threeCardImage"+index).alt=card.name||"Tarot kartı";
          document.getElementById("threeCardName"+index).textContent=card.name||"";
          document.getElementById("threeCardOrientation"+index).textContent=card.orientation==="reversed"?"TERS":"DÜZ";
        });
        threeCardsEl.style.display="grid";
        answerEl.textContent=data.answer||"";
        speakAnswer(data.answer||"",()=>finishItemAfterDisplay(data.questionId,"threecard_finished"));
        return;
      }
    }catch(error){console.error("LIVE event error:",error);}
  };
  socket.onerror=(error)=>{console.error("WebSocket error:",error);answerEl.textContent="LIVE bağlantısı kurulamadı.";};
  socket.onclose=()=>console.log("WebSocket bağlantısı kapandı.");
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  const voiceTestButton=document.getElementById("voiceTestButton");
  if(voiceTestButton) voiceTestButton.onclick=()=>speakAnswer("Merhaba. NinjaBox ses testi çalışıyor.");
</script>
</body>
</html>
